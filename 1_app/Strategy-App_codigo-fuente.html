<title>Strategy App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: tablero de planeación — barra superior fija con selector de empresa, pestañas por módulo/asignatura, contenido en rejilla de tarjetas sobre papel milimetrado tenue */
:root{
  --paper:#EEF2F3; --surface:#FFFFFF; --sunk:#F5F8F8; --ink:#13232A; --muted:#566A72; --line:#D3DDE0;
  --accent:#2350C8; --accent-soft:#E3EAFB; --gold:#9A6A12;
  --ok:#2C7A4B; --ok-soft:#E1F2E7; --warn:#A86A00; --warn-soft:#FBEFD6; --bad:#B8402B; --bad-soft:#F8E3DE;
  --grid:rgba(35,80,200,.06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1518; --surface:#152025; --sunk:#111A1E; --ink:#E2EBED; --muted:#93A6AD; --line:#283840;
  --accent:#86A6FF; --accent-soft:#1D2A4D; --gold:#D9A845;
  --ok:#6CC58F; --ok-soft:#173327; --warn:#E3AE4A; --warn-soft:#3A2C10; --bad:#F08A73; --bad-soft:#3D1F19;
  --grid:rgba(134,166,255,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1518; --surface:#152025; --sunk:#111A1E; --ink:#E2EBED; --muted:#93A6AD; --line:#283840;
  --accent:#86A6FF; --accent-soft:#1D2A4D; --gold:#D9A845;
  --ok:#6CC58F; --ok-soft:#173327; --warn:#E3AE4A; --warn-soft:#3A2C10; --bad:#F08A73; --bad-soft:#3D1F19;
  --grid:rgba(134,166,255,.05); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-weight:600}
button:hover{border-color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:4px 6px}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:9px 12px 8px;white-space:nowrap;color:var(--muted);display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
nav.tabs button small{font-weight:500;font-size:11px;letter-spacing:.03em}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.cardhead{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.cardhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.tile .s{font-size:12px}
.muted{color:var(--muted)}
.mono,.code{font-family:var(--f-mono);font-size:12.5px}
.code{font-weight:500;color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
tfoot td{font-weight:700;background:var(--sunk)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid transparent}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-acc{background:var(--accent-soft);color:var(--accent)}
.p-line{border-color:var(--line);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.plan td{font-size:12.5px}
.plan td.grp{background:var(--sunk);font-weight:600;min-width:180px}
.plan td.tac{min-width:180px}
.plan td.task{min-width:220px}
.plan tr.newtask td{color:var(--muted)}
.insight{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)),var(--surface)}
.insight{box-shadow:inset 4px 0 0 var(--accent)}
ul.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.ins li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
ul.ins .tag{flex:none;min-width:84px;text-align:center;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-top:1px}
.i-bad .tag{background:var(--bad-soft);color:var(--bad)}.i-warn .tag{background:var(--warn-soft);color:var(--warn)}.i-ok .tag{background:var(--ok-soft);color:var(--ok)}
.i-info .tag{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}.i-acc .tag{background:var(--accent);color:var(--surface)}
.nextstep{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13.5px}
.nextstep span{flex:1;min-width:220px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;font-size:12.5px;margin:0 0 12px;padding:10px 12px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ol.steps li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
ol.steps li.ok{background:var(--sunk)}
ol.steps .sn{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
ol.steps li.ok .sn{background:var(--ok);color:var(--surface);border-color:var(--ok)}
ol.steps li.part .sn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
ol.steps .sb{min-width:0}
ol.steps .sa{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){ol.steps li{grid-template-columns:auto 1fr}ol.steps .sa{grid-column:1/-1;justify-content:flex-start}}
#focusE,#simV{max-width:min(300px,70vw)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.pnav button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 14px;min-width:0;max-width:48%}
.pnav button.nx{align-items:flex-end;margin-left:auto;border-color:var(--accent)}
.pnav small{font-weight:500;color:var(--muted);font-size:11.5px}
.explist{display:flex;flex-direction:column;gap:8px}
.explist button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px}
.explist button span{font-weight:400;color:var(--muted);font-size:12.5px}
/* versión liviana */
nav.tabs{gap:4px;padding-block:4px 0}
nav.tabs button{flex-direction:row;align-items:center;gap:8px}
nav.tabs .tn{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
nav.tabs button[aria-selected="true"] .tn{background:var(--accent);border-color:var(--accent);color:var(--surface)}
nav.tabs .tl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
nav.tabs .tmore{margin-left:auto}
.menubtn{border-color:var(--accent);color:var(--accent)}
.qm{width:20px;height:20px;padding:0;border-radius:50%;font-size:12px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:4px;color:var(--accent);border-color:var(--accent);background:var(--surface)}
.tarea{border-color:var(--accent)}
.tarea.done{border-color:var(--ok);background:var(--ok-soft)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.dot2{width:30px;height:30px;padding:0;border-radius:50%;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.dot2.ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.dot2.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.dot2.cur{outline:3px solid var(--accent);outline-offset:2px}
.semgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.semit{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;text-align:left;padding:12px;font-weight:400}
.semit .sdot{width:14px;height:14px;border-radius:50%;grid-row:span 2;background:var(--line)}
.semit .sdot.n1{background:var(--ok)}.semit .sdot.n2{background:var(--warn)}.semit .sdot.n3{background:var(--bad)}
.semit .sname{font-weight:700}
.semit .sval{font-family:var(--f-display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.semit .sval small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.semit .sef,.semit .sproy{grid-column:2;font-size:12px}
.semit .sef.fav{color:var(--ok);font-weight:600}.semit .sef.desf{color:var(--bad);font-weight:600}
.semit .sproy{color:var(--muted)}
.semit .rec{color:var(--ink)}.semit .rec.al{color:var(--warn);font-weight:600}
.slist{display:flex;flex-direction:column;gap:8px}
.sitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;font-weight:400}
.sitem.rev{border-color:var(--bad)}
.sitem .stit{font-weight:700;display:flex;flex-direction:column}.sitem .stit small{font-weight:400;color:var(--muted);font-size:12px}
.sitem .smeta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px}
.kdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:var(--line)}
.kdot.ok{background:var(--ok)}.kdot.warn{background:var(--warn)}.kdot.bad{background:var(--bad)}
details.det{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details.det>summary{cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:2px;list-style:none}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary b{color:var(--accent)}details.det>summary b::before{content:"▸ ";}details.det[open]>summary b::before{content:"▾ "}
details.det>summary span{font-size:12.5px;color:var(--muted)}
details.det .detin{display:flex;flex-direction:column;gap:18px;padding:0 12px 14px}
details.mas{margin-top:8px}details.mas summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
details.aviso{font-size:12.5px;color:var(--muted);border:1px dashed var(--warn);border-radius:8px;padding:6px 12px;background:var(--warn-soft)}
details.aviso summary{cursor:pointer}details.aviso p{margin:6px 0 0}
details.advf{border-top:1px solid var(--line);padding-top:10px}details.advf summary{cursor:pointer;font-weight:600;font-size:13px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.wbtn{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;font-weight:400}
.wbtn b{font-size:16px}.wbtn span:last-child{color:var(--muted);font-size:13px}
.wbtn .num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700}
@media (max-width:640px){.brand span{display:none}nav.tabs .tl small{display:none}nav.tabs button{padding:8px 8px 7px}.sitem{grid-template-columns:auto 1fr}.sitem .smeta{grid-column:1/-1;align-items:flex-start}}
.gflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.gstep{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:4px;min-width:0}
.gstep h3{margin:4px 0 0}.gstep p{margin:4px 0 0;font-size:13px}
.gstep .num{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.garrow{align-self:center;color:var(--accent);font-size:20px;font-weight:700}
ol.gol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.guiago{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--accent)}
@media (max-width:900px){.gflow{grid-template-columns:1fr}.garrow{transform:rotate(90deg);justify-self:center}}
.actstrip{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:10px 14px;font-size:13px}
.actl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.actl .ago{color:var(--muted);font-size:12px;white-space:nowrap}
.live{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.franja{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 12px;border:1px dashed var(--line);border-radius:8px;font-size:13px;background:var(--surface)}
.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.chain .step{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px;min-width:0}
.chain .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
ul.plain{margin:4px 0 0;padding-left:16px;font-size:13px}
.chip{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--sunk)}
.chip.alert{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.banner{border:1px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px}
.banner b{color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.vc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.vc .slot{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--sunk);min-height:90px;display:flex;flex-direction:column;gap:5px}
.vc .slot h4{margin:0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.vc .apoyo{grid-column:span 5;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fd{font-size:12px;line-height:1.3;border-left:3px solid var(--ok);padding-left:6px}
.fd.d{border-left-color:var(--bad)}
.fd.ext{border-left:3px dashed var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:0 4px 4px 0;padding:2px 6px}
.strat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:14px}
.strat .card{display:flex;flex-direction:column;gap:8px}
.strat .card.rev{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
ul.tac{margin:0;padding-left:18px;font-size:13px}
svg text{font-family:var(--f-body)}
.svgbox{overflow-x:auto}
.method p,.method li{max-width:72ch}
.method code{font-family:var(--f-mono);font-size:12.5px;background:var(--sunk);padding:1px 4px;border-radius:4px}
.sim{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.sim label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,20,25,.45);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none!important}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(720px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.form label.full{grid-column:1/-1}
.form label.chk{flex-direction:row;align-items:center;gap:8px}
.form .hint{font-weight:400;font-size:11.5px}
.multi{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:170px;overflow:auto}
.multi label{flex-direction:row;align-items:center;gap:5px;font-weight:500;color:var(--ink);font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 7px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:720px){.form{grid-template-columns:1fr}.vc{grid-template-columns:1fr 1fr}.vc .apoyo{grid-column:span 2;grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card,.tile{transition:border-color .15s}}
</style>

<header class="top">

const TABS=[
 ["guia","Cómo funciona","Instrucciones"],

 ["tablero","Tablero","Salida integrada"],

/* ---------- series y estadística ---------- */
function parseSerie(txt){
  const out=[];String(txt||"").split(/\n+/).forEach(line=>{
    line=line.trim();if(!line)return;const parts=line.split(/[;\t]|\s{2,}/);if(parts.length<2)return;
    const p=parts[0].trim();let v=parts[parts.length-1].trim();
    if(v.includes(",")&&v.includes("."))v=v.replace(/\./g,"").replace(",",".");else v=v.replace(",",".");
    const n=Number(v);if(p&&isFinite(n))out.push({p,v:n});
  });
  return out.sort((a,b)=>a.p<b.p?-1:a.p>b.p?1:0);
}
const serieTxt=arr=>(arr||[]).map(o=>o.p+";"+o.v).join("\n");
const sortS=arr=>[...(arr||[])].filter(o=>o&&o.p!=null&&isFinite(o.v)).sort((a,b)=>a.p<b.p?-1:a.p>b.p?1:0);
function lagChange(serie,tr,lag){const s=sortS(serie),m=new Map();
  for(let i=lag;i<s.length;i++){const a=s[i-lag].v,b=s[i].v;
    if(tr==="raw")m.set(s[i].p,b);else if(tr==="diff")m.set(s[i].p,b-a);else if(a!==0)m.set(s[i].p,(b/a-1)*100)}
  return m}
function stats(xm,ym){const xs=[],ys=[];xm.forEach((x,p)=>{if(ym.has(p)){xs.push(x);ys.push(ym.get(p))}});
  const n=xs.length;if(n<3)return{n,r:null,beta:null,r2:null};
  const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;
  for(let i=0;i<n;i++){const dx=xs[i]-mx,dy=ys[i]-my;sxy+=dx*dy;sxx+=dx*dx;syy+=dy*dy}
  if(sxx===0||syy===0)return{n,r:null,beta:null,r2:null};
  const r=sxy/Math.sqrt(sxx*syy);return{n,r,beta:sxy/sxx,r2:r*r}}
function ieCell(mefe,mefi){if(mefe==null||mefi==null)return null;
  const row=mefe>=3?0:mefe>=2?1:2,col=mefi>=3?0:mefi>=2?1:2;const n=row*3+col;
  const rom=["I","II","III","IV","V","VI","VII","VIII","IX"][n];
  const zona=[0,1,3].includes(n)?"Crecer y construir":[2,4,6].includes(n)?"Conservar y mantener":"Cosechar o desinvertir";
  return{row,col,rom,zona}}

/* ---------- Módulo I: volatilidad, exposición y proyecciones ---------- */
const CANALES=[["pib","Ciclo económico (PIB)"],["inflacion","Inflación"],["tasa","Tasa de interés"],["trm","Tasa de cambio"],["desempleo","Empleo"],["confianza","Confianza del consumidor"],["otro","Otro"]];
const NIVEL_TXT=["","Normal","Inusual","Muy inusual"];
const EXP_TXT=["","Baja","Media","Alta"];
const sd=a=>{if(a.length<2)return null;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const unidadMov=v=>v.transformacion==="pct"?"%":"pp";
// Movimiento de un periodo al siguiente y su comparación con el movimiento típico de la ventana reciente
function volatilidad(v,shock){
  const s=sortS(v.serie);if(s.length<6)return null;const steps=[];
  for(let i=1;i<s.length;i++){const a=s[i-1].v,b=s[i].v;steps.push(v.transformacion==="pct"?(a?(b/a-1)*100:0):b-a)}
  const W=Math.max(6,num(v.ventana)||12);
  const hist=(shock!=null?steps:steps.slice(0,-1)).slice(-W);
  const last=shock!=null?shock:steps[steps.length-1];
  const mu=mean(hist),sig=sd(hist);if(!sig)return null;
  const z=(last-mu)/sig,az=Math.abs(z);const nivel=az<1?1:az<2?2:3;
  const rec=sd(steps.slice(-4)),ratio=rec!=null?rec/sig:null;
  return{steps,last,mu,sig,z,nivel,ratio,W,periodo:s[s.length-1].p,valor:s[s.length-1].v,simulado:shock!=null}
}
// Efecto de una SUBIDA de la variable para la empresa: +1 favorable, −1 desfavorable
function efectoSubida(v,e){
  if(v.efectoSubida==="favorable")return 1;if(v.efectoSubida==="desfavorable")return -1;
  const aseg=e.tipoEmpresa==="aseguradora";
  switch(v.canal){case"pib":return 1;case"inflacion":return -1;case"tasa":return aseg?1:-1;
    case"trm":return(e.importa==="si"||e.deudaUSD==="si")?-1:(e.exporta==="si"?1:-1);
    case"desempleo":return -1;case"confianza":return 1;default:return -1}
}
function proyResumen(v,s){
  const P=(v.proy||[]).filter(p=>num(p.valor)!=null);const last=s.length?s[s.length-1].v:null;
  const y=new Date().getFullYear();const prox=P.filter(p=>String(p.horizonte).includes(String(y))&&p.tipo!=="promedio");
  const m=prox.length?mean(prox.map(p=>num(p.valor))):null;
  let dir=null;if(m!=null&&last!=null&&Math.abs(m-last)>1e-9)dir=Math.sign(m-last);
  return{P,prox:m,dir,anio:y}
}
// Estados financieros simplificados (3 años) → lecturas de exposición
function finanzas(e,vars){
  const rows=[...(e.financieros||[])].filter(r=>r&&num(r.anio)!=null).sort((a,b)=>num(a.anio)-num(b.anio));
  const vP=vars.find(v=>v.canal==="pib"),vI=vars.find(v=>v.canal==="inflacion");
  const pibAnual=y=>{if(!vP)return null;const xs=sortS(vP.serie).filter(o=>String(o.p).startsWith(y+"-")).map(o=>o.v);return xs.length===4?mean(xs):null};
  const inflDic=y=>{if(!vI)return null;const o=sortS(vI.serie).find(o=>o.p===y+"-T4");return o?o.v:null};
  const out=rows.map((r,i)=>{const p=i?rows[i-1]:null;const ing=num(r.ingresos),egr=num(r.egresos),ut=num(r.utilidad),A=num(r.activos),Pa=num(r.pasivos),Pt=num(r.patrimonio);
    const g=(x,y)=>(x!=null&&y)?(x/y-1)*100:null;const gIng=p?g(ing,num(p.ingresos)):null,gEgr=p?g(egr,num(p.egresos)):null;
    const pi=inflDic(r.anio),pib=pibAnual(r.anio);const real=(gIng!=null&&pi!=null)?((1+gIng/100)/(1+pi/100)-1)*100:null;
    const mult=(real!=null&&pib)?real/pib:null;const margen=(ut!=null&&ing)?ut/ing*100:null;const endeud=(Pa!=null&&A)?Pa/A*100:null;
    const cuadre=(A!=null&&Pa!=null&&Pt!=null&&A)?Math.abs(A-(Pa+Pt))/A:null;
    return{...r,ing,egr,ut,A,Pa,Pt,gIng,gEgr,pi,pib,real,mult,margen,endeud,cuadre}});
  return{rows:out,ult:out.length?out[out.length-1]:null,n:out.length}
}
function exposicion(v,e,FX){
  const m=num(v.exposicionManual);if(m>=1&&m<=3)return{n:m,why:"Asignada por el equipo."+(v.exposicionNota?" "+v.exposicionNota:"")};
  const u=FX.ult,aseg=e.tipoEmpresa==="aseguradora";
  const viaPIB=()=>{if(!u||u.mult==null)return null;const a=Math.abs(u.mult);return{n:a>=1.5?3:a>=0.5?2:1,why:`En ${u.anio} los ingresos reales crecieron ${fmt(u.real,1)} % frente a ${fmt(u.pib,1)} % del PIB: ${fmt(u.mult,1)} veces la economía.`}};
  switch(v.canal){
    case"pib":return viaPIB();
    case"inflacion":{if(!u||u.gIng==null)return null;const pierde=u.real!=null&&u.real<0,egrMas=u.gEgr!=null&&u.gEgr>u.gIng;
      const n=pierde&&egrMas?3:(pierde||egrMas)?2:1;return{n,why:`Ingresos ${fmt(u.gIng,1)} % nominal (${fmt(u.real,1)} % real); egresos ${fmt(u.gEgr,1)} %. ${egrMas?"Los egresos crecieron más rápido que los ingresos.":"Los ingresos crecieron más rápido que los egresos."}`}}
    case"tasa":{if(!u||u.endeud==null)return null;if(aseg)return{n:2,why:`Endeudamiento ${fmt(u.endeud,0)} %, normal en una aseguradora por sus reservas técnicas. Una subida de tasas suele favorecer el rendimiento de sus inversiones.`};
      const n=u.endeud>60?3:u.endeud>=40?2:1;return{n,why:`Pasivo / activo = ${fmt(u.endeud,0)} % (referencia orientativa: menos de 40 % baja, más de 60 % alta).`}}
    case"trm":{const k=["importa","exporta","deudaUSD"].filter(x=>e[x]==="si").length;const nsa=["importa","exporta","deudaUSD"].filter(x=>!e[x]||e[x]==="nsa").length;
      if(nsa===3)return null;return{n:k>=2?3:k===1?2:1,why:`Importa: ${({si:"sí",no:"no"})[e.importa]||"sin dato"} · exporta: ${({si:"sí",no:"no"})[e.exporta]||"sin dato"} · deuda en dólares: ${({si:"sí",no:"no"})[e.deudaUSD]||"sin dato"}.`}}
    case"desempleo":case"confianza":{if(aseg)return{n:2,why:"Afecta la compra de seguros voluntarios de hogares y personas."};const r=viaPIB();return r?{n:r.n,why:"Empresa de consumo: se lee igual que el ciclo económico. "+r.why}:null}
    default:return null}
}

/* ---------- Conexión Módulo I → Módulo II ---------- */
// Corte BCG = crecimiento nominal esperado de la economía: (1 + PIB real proyectado) × (1 + inflación esperada) − 1
function corteBCG(e,V){
  const man=num(e.bcgCorte)??10;if(e.bcgCorteModo==="manual")return{corte:man,auto:false,why:"Corte fijado a mano por el equipo."};
  const p=V.find(v=>v.canal==="pib"),i=V.find(v=>v.canal==="inflacion");const g=p&&p.pr.prox,pi=i&&i.pr.prox;
  if(g==null||pi==null)return{corte:man,auto:false,why:"Sin proyecciones de PIB e inflación: se usa el corte manual."};
  const c=((1+g/100)*(1+pi/100)-1)*100;
  return{corte:c,auto:true,why:`Un mercado crece "alto" si supera el crecimiento nominal esperado de la economía en ${p.pr.anio}: PIB real ${fmt(g,2)} % y inflación ${fmt(pi,2)} % (promedio de proyecciones del Módulo I).`}}
// Canal macro → eslabón de la cadena de valor donde golpea
const CANAL_ESLABON={trm:"abast",inflacion:"oper",tasa:"infra",pib:"mkt",desempleo:"mkt",confianza:"mkt"};
// Fortalezas y debilidades sugeridas a partir de los estados financieros simplificados
function sugerenciasMEFI(C){
  const e=S.emp,R=C.FX.rows,u=C.FX.ult,p=R.length>1?R[R.length-2]:null,out=[];if(!u)return out;const y=u.anio,aseg=e.tipoEmpresa==="aseguradora";
  const add=(clave,tipo,eslabon,factor,evid)=>out.push({clave:clave+"-"+y,tipo,eslabon,factor,evidencia:evid+` Fuente: estados financieros simplificados (Módulo I), año ${y}.`});
  if(u.mult!=null){if(u.mult>=1.2)add("fin-crec","F","mkt","Crece más rápido que la economía",`Ingresos reales +${fmt(u.real,1)} % frente a PIB ${fmt(u.pib,1)} %: ${fmt(u.mult,1)} veces la economía.`);
    else if(u.mult<0.8)add("fin-crec","D","mkt","Crece más despacio que la economía",`Ingresos reales ${fmt(u.real,1)} % frente a PIB ${fmt(u.pib,1)} %: ${fmt(u.mult,1)} veces la economía.`)}
  if(u.real!=null&&u.real<0)add("fin-real","D","mkt","Los ingresos pierden frente a la inflación",`Ingresos +${fmt(u.gIng,1)} % nominal, ${fmt(u.real,1)} % real con inflación de ${fmt(u.pi,2)} %.`);
  if(u.gEgr!=null&&u.gIng!=null){if(u.gEgr>u.gIng)add("fin-costos","D","oper","Los egresos crecen más rápido que los ingresos",`Egresos +${fmt(u.gEgr,1)} % frente a ingresos +${fmt(u.gIng,1)} %.`);
    else add("fin-costos","F","oper","Control de costos: los egresos crecen menos que los ingresos",`Egresos +${fmt(u.gEgr,1)} % frente a ingresos +${fmt(u.gIng,1)} %.`)}
  if(p&&u.margen!=null&&p.margen!=null&&Math.abs(u.margen-p.margen)>=0.1){if(u.margen>p.margen)add("fin-margen","F","infra","Mejora del margen neto",`Margen neto pasa de ${fmt(p.margen,1)} % a ${fmt(u.margen,1)} %.`);
    else add("fin-margen","D","infra","Deterioro del margen neto",`Margen neto pasa de ${fmt(p.margen,1)} % a ${fmt(u.margen,1)} %.`)}
  if(u.endeud!=null){if(aseg){if(p&&p.Pt&&u.Pt>p.Pt)add("fin-patrimonio","F","infra","Fortalecimiento patrimonial",`Patrimonio +${fmt((u.Pt/p.Pt-1)*100,1)} % en el año; endeudamiento de ${fmt(u.endeud,0)} %, propio de una aseguradora por sus reservas técnicas.`)}
    else if(u.endeud>60)add("fin-deuda","D","infra","Endeudamiento alto",`Pasivo / activo = ${fmt(u.endeud,0)} % (referencia orientativa: más de 60 % es alto).`);
    else if(u.endeud<40)add("fin-deuda","F","infra","Bajo endeudamiento",`Pasivo / activo = ${fmt(u.endeud,0)} % (referencia orientativa: menos de 40 % es bajo).`)}
  const usados=new Set(S.d.internos.map(f=>f.origen).filter(Boolean));out.forEach(o=>o.usado=usados.has(o.clave));return out}

/* ---------- cálculo integrado ---------- */
function compute(){
  const e=S.emp||{},d=S.d,lag=e.comparacion==="trimestral"?1:4;
  const rev=lagChange(e.ingresos,"pct",lag);
  const metodo=e.metodoPeso==="correlacion"?"correlacion":"exposicion";
  const FX=finanzas(e,d.variables);
  const V=d.variables.map(v=>{
    const ch=lagChange(v.serie,v.transformacion,lag),st=stats(ch,rev);const s=sortS(v.serie);
    const simOn=S.sim.vid===v.id&&num(S.sim.shock)!=null;
    const vol=volatilidad(v,simOn?num(S.sim.shock):null);
    const mov=vol?vol.steps[vol.steps.length-1]:null;const movEf=vol?vol.last:null;
    const umbral=num(v.umbral);
    const alerta=umbral!=null?(movEf!=null&&Math.abs(movEf)>=umbral):!!(vol&&vol.nivel===3);
    const lastCh=[...ch.values()].pop();
    const ef=efectoSubida(v,e);
    const exp=exposicion(v,e,FX);
    // Tipo O/A: método de exposición = dirección del último movimiento × efecto de una subida para esta empresa
    let sugExp=null;if(movEf!=null&&movEf!==0)sugExp=Math.sign(movEf)*ef>0?"O":"A";
    const proy=proyResumen(v,s);
    if(sugExp==null&&proy.dir)sugExp=proy.dir*ef>0?"O":"A";
    const sugCorr=(st.r!=null&&lastCh!=null)?(st.r*lastCh>=0?"O":"A"):null;
    const sug=metodo==="correlacion"?sugCorr:sugExp;
    const tipo=(v.tipoManual==="O"||v.tipoManual==="A")?v.tipoManual:sug;
    const impacto=(st.beta!=null&&movEf!=null)?st.beta*movEf:null;
    const riesgo=(exp&&vol)?exp.n*vol.nivel:null;
    const proyEfecto=proy.dir?(proy.dir*ef>0?"fav":"desf"):null;
    return{...v,...st,ultimo:s.length?s[s.length-1]:null,mov,movEf,simOn,alerta,sug,tipo,impacto,expl:st.n<12,vol,exp,ef,riesgo,pr:proy,proyEfecto}
  });
  const sumAbs=V.reduce((a,v)=>a+(v.r!=null?Math.abs(v.r):0),0);
  const sumRisk=V.reduce((a,v)=>a+(v.riesgo||0),0);
  V.forEach(v=>{v.pesoCorr=(v.r!=null&&sumAbs>0)?Math.abs(v.r)/sumAbs:null;v.pesoExp=(v.riesgo!=null&&sumRisk>0)?v.riesgo/sumRisk:null;
    v.peso=metodo==="correlacion"?v.pesoCorr:v.pesoExp;const c=num(v.calificacion);v.pond=(v.peso!=null&&c!=null)?v.peso*c:null});
  const mefe=V.some(v=>v.pond!=null)?V.reduce((a,v)=>a+(v.pond||0),0):null;
  const F=d.internos.map(f=>{const p=num(f.peso),c=num(f.calificacion);return{...f,p,c,pond:(p!=null&&c!=null)?p*c:null}});
  const sumPesoF=F.reduce((a,f)=>a+(f.p||0),0);
  const mefi=F.some(f=>f.pond!=null)?F.reduce((a,f)=>a+(f.pond||0),0):null;
  const vById=new Map(V.map(v=>[v.id,v])),pById=new Map(d.pestel.map(p=>[p.id,p])),fById=new Map(F.map(f=>[f.id,f]));
  const E=d.estrategias.map(s=>{const vs=(s.variables||[]).map(id=>vById.get(id)).filter(Boolean);
    const alertV=vs.filter(v=>v.alerta);return{...s,vs,ps:(s.externos||[]).map(id=>pById.get(id)).filter(Boolean),
    fs:(s.factores||[]).map(id=>fById.get(id)).filter(Boolean),alertV,rev:alertV.length>0}});
  const eById=new Map(E.map(s=>[s.id,s]));
  const K=d.kpis.map(k=>{const b=num(k.lineaBase),m=num(k.meta),a=num(k.actual);let prog=null;
    if(b!=null&&m!=null&&a!=null&&m!==b)prog=(a-b)/(m-b);
    // Semáforo: rojo 0–59 %, amarillo 60–95 %, verde por encima de 95 %
    const sem=prog==null?"sin":prog>.95?"ok":prog>=.6?"warn":"bad";const s=eById.get(k.estrategia);

 bcg:["Matriz BCG","Clasifica las líneas de negocio según cuánto crece su mercado y qué tan grande es la empresa frente al líder: estrella (crece y lidera), interrogante (crece pero no lidera), vaca (lidera en un mercado lento) o perro (ni crece ni lidera)."],
 adl:["Matriz ADL","Cruza la madurez del sector, de embrionario a envejecido, con la posición competitiva de la empresa, de dominante a débil, para orientar el tipo de estrategia."],
 ie:["Matriz interna-externa","Combina el total de la MEFE (entorno) y el de la MEFI (interno) en una de nueve celdas. Cada zona sugiere un tipo de estrategia: crecer y construir, conservar y mantener, o cosechar y desinvertir."],
 cumplimiento:["Cumplimiento de un indicador","Cumplimiento = (valor medido − línea base) ÷ (meta − línea base). Rojo de 0 % a 59 %, amarillo de 60 % a 95 %, verde por encima de 95 %."],
 trazabilidad:["Trazabilidad","Cada decisión queda amarrada a la variable del entorno y al factor interno que la originaron, y al indicador que la vigila. Si el entorno se mueve, la app sabe qué decisiones revisar."],
 proyeccion:["Proyecciones","Lo que esperan el FMI, el Banco Mundial, la OCDE, el Banco de la República y los analistas para el cierre del año. Sirven para anticipar si el próximo movimiento será favorable o no."]};

   <div class="row" style="gap:8px;margin-top:8px"><h2 style="margin:0">${cur.n}. ${esc(cur.t)}</h2>${ST_PILL[cur.s]}</div>
   <p style="margin:6px 0 0;max-width:80ch">${esc(cur.d)}</p>${cur.x?`<div class="mono muted" style="font-size:12px;margin-top:4px">${esc(cur.x)}</div>`:""}
   ${cur.dep&&cur.s!=="ok"?`<div class="banner" style="margin-top:8px">Este paso usa resultados del paso ${cur.dep}. Puedes avanzar, pero conviene completarlo primero.</div>`:""}
   <div class="row" style="margin-top:12px">${cur.b.map((b,j)=>btnPaso(b,j===0)).join("")}<div class="spacer"></div>

   <div class="semgrid">${V.map(v=>{const m=v.movEf,ef=m?(Math.sign(m)*v.ef>0?"fav":"desf"):null;return `<button class="semit" data-edit="variables" data-id="${esc(v.id)}"><span class="sdot n${v.vol?v.vol.nivel:0}"></span><span class="sname">${esc(v.nombre)}</span><span class="sval">${v.ultimo?fmtV(v,v.ultimo.v):"—"}${m!=null?` <small>${m>0?"▲":m<0?"▼":"■"} ${fmt(Math.abs(m),2)} ${unidadMov(v)}</small>`:""}</span><span class="sef ${ef||""}">${ef==="fav"?"Le favorece":ef==="desf"?"Le perjudica":"Sin cambio"}</span>${v.reciente&&v.reciente.corto?`<span class="sproy rec${v.reciente.alerta?" al":""}">Reciente: ${esc(v.reciente.corto)}</span>`:""}${v.pr.prox!=null?`<span class="sproy">Se espera ${fmtV(v,v.pr.prox)} al cierre ${v.pr.anio}</span>`:""}</button>`}).join("")}</div></div>`}

const KIND_TXT={variables:"la variable",pestel:"el factor PESTEL",internos:"el factor interno",unidades:"la unidad de negocio",estrategias:"la estrategia",kpis:"el indicador",tareas:"la tarea",empresa:"los datos de la empresa",financieros:"los estados financieros",copia:"una copia"};
const KIND_ASIG={variables:"Macroeconomía",pestel:"Macroeconomía",financieros:"Macroeconomía",internos:"Planeación Estratégica",unidades:"Planeación Estratégica",estrategias:"Gerencia Estratégica",kpis:"Gerencia Estratégica",tareas:"Gerencia Estratégica"};
function hace(iso){const d=(Date.now()-new Date(iso).getTime())/1000;if(!isFinite(d))return"";if(d<60)return"hace un momento";if(d<3600)return`hace ${Math.round(d/60)} min`;if(d<86400)return`hace ${Math.round(d/3600)} h`;if(d<172800)return"ayer";return new Date(iso).toLocaleDateString("es-CO",{day:"numeric",month:"short"})}
const quien=id=>{if(!id)return"Alguien";if(id===S.uid)return"Tú";const n=S.names&&S.names[id];return n||"Un integrante"};
function logAct(accion,kind,codigo,texto){
  if(!S.db||!S.eid)return;
  const doc={quien:S.uid||null,asig:S.asig||"",cuando:new Date().toISOString(),accion,kind,codigo:codigo||"",texto:String(texto||"").slice(0,90)};
  S.db.collection(`empresas/${S.eid}/actividad`).doc().set(doc).catch(()=>{});
  if(Math.random()<.1)podarAct()}
async function podarAct(){try{const q=await S.db.collection(`empresas/${S.eid}/actividad`).orderBy("cuando","desc").get();for(const d of q.docs.slice(150))await S.db.doc(`empresas/${S.eid}/actividad/${d.id}`).delete()}catch(e){}}
async function resolverNombres(ids){if(!S.user)return;const falta=ids.filter(i=>i&&i!==S.uid&&!(S.names&&i in S.names));if(!falta.length)return;
  try{const ps=await S.user.profiles(falta);S.names=S.names||{};falta.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||"");schedule()}catch(e){}}
function actItem(a){const asig=a.asig?` <span class="muted">(${esc(a.asig)})</span>`:"";return `<li><b>${esc(quien(a.quien))}</b>${asig} ${esc(a.accion)} ${esc(KIND_TXT[a.kind]||"")} ${a.codigo?`<span class="code">${esc(a.codigo)}</span>`:""}${a.texto?` <span class="muted">· ${esc(a.texto)}</span>`:""} <span class="ago">${esc(hace(a.cuando))}</span></li>`}
function actStrip(){const A=S.act||[];if(!A.length)return `<div class="actstrip muted">Aún no hay actividad registrada en esta empresa. Cuando alguien guarde algo, aparecerá aquí.</div>`;

${e.ilustrativo?`<details class="aviso"><summary><b>Ejercicio académico de aula.</b> No es asesoría ni recomendación de inversión. Algunos datos son de prueba. <u>Ver más</u></summary><p>No compromete a la Universidad ni a la empresa. ${esc(e.notaDatos||"Las series marcadas como ilustrativas deben reemplazarse por las cifras de fuente oficial antes de reportar resultados.")}</p></details>`:`<div class="muted" style="font-size:12px">Ejercicio académico de aula: no constituye asesoría ni recomendación de inversión.</div>`}`}

function kpiTable(C,compact){
  const K=[...C.K].sort(byCode);if(!K.length)return '<div class="empty">Sin indicadores. Créalos en el Módulo III.</div>';
  return `${semLegend}<div class="tbl"><table><thead><tr><th>Código</th><th>Indicador</th>${compact?"":"<th>Fórmula</th><th>Estrategia</th>"}<th class="n">Base</th><th class="n">Meta</th><th class="n">Valor medido</th><th class="n">Cumplimiento</th><th>Semáforo</th></tr></thead><tbody>
  ${K.map(k=>`<tr class="click" data-edit="kpis" data-id="${esc(k.id)}"><td class="code">${esc(k.codigo)}</td><td>${esc(k.nombre)}<div class="muted" style="font-size:12px">${esc(k.unidad||"")}${k.frecuencia?" · "+esc(k.frecuencia):""}</div></td>

function frase(v){

function levelSVG(v){

function planTable(C){
  const E=[...C.E].sort(byCode);if(!E.length)return '<div class="empty">Primero formula al menos una estrategia con sus tácticas.</div>';
  let rows="";
  E.forEach(s=>{
    const tacs=tacticasDe(s);const groups=tacs.map(t=>({t,tasks:s.ts.filter(x=>x.tactica===t).sort((a,b)=>String(a.inicio||"").localeCompare(String(b.inicio||""))||byCode(a,b))}));
    const huerf=s.ts.filter(x=>!x.tacOk);if(huerf.length)groups.push({t:null,tasks:huerf});
    if(!groups.length)groups.push({t:"",tasks:[],sinTac:true});
    const spanE=groups.reduce((a,g)=>a+g.tasks.length+1,0);let first=true;
    groups.forEach(g=>{
      const spanT=g.tasks.length+1;
      const tacCell=g.sinTac?`<td class="tac muted" rowspan="${spanT}">La estrategia no tiene tácticas. <button class="ghost" data-edit="estrategias" data-id="${esc(s.id)}">Agregar tácticas</button></td>`
        :g.t===null?`<td class="tac" rowspan="${spanT}"><span class="pill p-warn">Táctica modificada o eliminada</span><div class="muted">Reasigna estas tareas.</div></td>`
        :`<td class="tac" rowspan="${spanT}">${esc(g.t)}</td>`;
      const lead=(first?`<td class="grp" rowspan="${spanE}">${esc(s.objetivo||"—")}</td><td class="grp" rowspan="${spanE}"><span class="code">${esc(s.codigo)}</span> ${esc(s.estrategia)}<div class="muted" style="font-weight:400">Plazo: ${fDate(s.inicio)} → ${fDate(s.fin)}</div></td>`:"")+tacCell;first=false;
      let leadUsed=false;const L=()=>{if(leadUsed)return"";leadUsed=true;return lead};
      g.tasks.forEach(t=>{const a=`data-edit="tareas" data-id="${esc(t.id)}" style="cursor:pointer"`;rows+=`<tr>${L()}<td class="task" ${a}><span class="code">${esc(t.codigo)}</span> ${esc(t.tarea)}${t.fechaMal?'<div><span class="pill p-bad">El cierre es anterior al inicio</span></div>':""}${t.fueraPlazo?'<div><span class="pill p-warn">Fuera del plazo de la estrategia</span></div>':""}</td><td class="n" ${a}>${fDate(t.inicio)}</td><td class="n" ${a}>${fDate(t.fin)}</td><td ${a}>${esc(t.responsable||"—")}</td><td ${a}>${esc(t.recursos||"—")}</td></tr>`});
      rows+=`<tr class="newtask">${L()}<td colspan="5">${S.canWrite&&!g.sinTac&&g.t!==null?`<button class="ghost" data-newtask="${esc(s.id)}" data-tac="${esc(g.t)}">+ Agregar tarea</button>`:""}</td></tr>`;
    });
  });
  return `<div class="tbl plan"><table><thead><tr><th>Objetivo estratégico</th><th>Estrategia</th><th>Táctica</th><th>Tarea</th><th class="n">Fecha de inicio</th><th class="n">Fecha de cierre</th><th>Responsable</th><th>Recursos</th></tr></thead><tbody>${rows}</tbody></table></div>`}

function vMetodo(){
  return `<div class="card method"><div class="eyebrow">Documentación del procedimiento</div><h1 style="margin:4px 0 10px">Cómo calcula Strategy App</h1>
  <h3>1. Semáforo de volatilidad</h3><p>Para cada variable se calcula el movimiento de un periodo al siguiente: en puntos porcentuales si ya es una tasa (inflación, tasa de intervención, desempleo, crecimiento del PIB) y en variación % si es un nivel (TRM). Con los últimos 12 movimientos (ventana ajustable) se obtiene el movimiento promedio <code>μ</code> y la desviación estándar <code>σ</code>, que es el "movimiento típico". El último movimiento se compara así: <code>z = (último − μ) / σ</code>. Verde si |z| &lt; 1, amarillo si está entre 1 y 2, rojo si es 2 o más. La volatilidad reciente compara la σ de los últimos 4 movimientos con la de la ventana: por encima de 1,25 veces se marca "en aumento".</p>
  <h3>2. Exposición con estados financieros simplificados</h3><p>Con seis cifras por año (ingresos, egresos, utilidad neta, activos, pasivos y patrimonio) la app calcula: crecimiento nominal de ingresos; crecimiento real <code>= (1 + nominal) / (1 + inflación de diciembre) − 1</code>; veces que la empresa creció frente a la economía <code>= real / PIB</code>, con el PIB anual aproximado como promedio de los cuatro trimestres; crecimiento de egresos; margen neto <code>= utilidad / ingresos</code>; y endeudamiento <code>= pasivo / activo</code>. La exposición (1 baja, 2 media, 3 alta) se asigna así: PIB por las veces frente a la economía (≥ 1,5 alta; 0,5–1,5 media); inflación según si los ingresos pierden contra la inflación y si los egresos crecen más que los ingresos; tasa de interés por el endeudamiento (más de 60 % alta; 40–60 % media; referencia orientativa); TRM por las respuestas sobre importaciones, exportaciones y deuda en dólares. En una aseguradora el pasivo alto es normal por las reservas técnicas, y una subida de tasas suele favorecer sus inversiones. El equipo puede fijar la exposición a mano con su sustento.</p>
  <h3>3. Mapa de riesgo, pesos y tipo O/A</h3><p><code>Riesgo = exposición × nivel de volatilidad</code> (de 1 a 9): 6 o más es prioritario, 3–4 se vigila, 1–2 es bajo. <code>Peso MEFE = riesgo / Σ riesgo</code>, de modo que los pesos suman 1 y salen de datos, no de asignación libre. La variable es oportunidad si su último movimiento va en la dirección que favorece a la empresa (por ejemplo, una bajada de tasas para una empresa endeudada) y amenaza en el caso contrario. <code>MEFE = Σ peso × calificación (1–4)</code>. Las proyecciones de organismos y analistas se comparan con el último dato para anticipar si el próximo movimiento sería favorable o desfavorable.</p>
  <h3>Nivel avanzado: sensibilidad estadística</h3><p>Cuando hay 12 o más trimestres de ingresos, se puede usar la correlación de Pearson entre la variación de cada variable y la de los ingresos (<code>Peso = |r| / Σ|r|</code>, <code>β = cov / var</code>). Con 3 años de cifras anuales no aplica: solo habría dos variaciones. Correlación no implica causalidad.</p>
  <h3>Conexión del Módulo I con el Módulo II</h3><p>Las seis cifras financieras generan fortalezas y debilidades sugeridas (crecimiento real frente a la economía, costos frente a ingresos, margen, endeudamiento o patrimonio), cada una con su evidencia; el equipo decide si entran a la MEFI. Las variables con exposición media o alta se muestran en el eslabón de la cadena de valor por donde golpean: TRM en abastecimiento, inflación en operaciones, tasa de interés en infraestructura (financiación) y ciclo económico en marketing y ventas. El corte de la BCG es el crecimiento nominal esperado de la economía <code>= (1 + PIB real proyectado) × (1 + inflación esperada) − 1</code>: un mercado es de alto crecimiento si crece más que la economía.</p>
  <h3>4. MEFI, matriz IE, BCG y ADL</h3><p><code>MEFI = Σ peso × calificación</code>, con pesos asignados por el equipo que deben sumar 1,00. La matriz interna-externa cruza los dos totales con cortes en 2,0 y 3,0. En la BCG, el cuadrante sale del crecimiento del mercado frente al corte definido y de la participación relativa frente a 1,0. La ADL ubica la zona orientativa según madurez del sector y posición competitiva.</p>
  <h3>5. Regla de trazabilidad y alerta</h3><p>Una variable entra en alerta cuando su semáforo de volatilidad está en rojo, o cuando supera el umbral manual si el equipo lo definió. Esto aplica también a los movimientos simulados; toda estrategia vinculada a ella queda <b>en revisión</b>, y también los indicadores que la vigilan. Cumplimiento de indicador: <code>(medido − base) / (meta − base)</code>, que funciona igual para indicadores que deben subir o bajar. Semáforo: rojo de 0 % a 59 % (lejos de la meta), amarillo de 60 % a 95 %, verde por encima de 95 %.</p>
  <h3>6. Plan de acción y alcance</h3><p>El plan de acción toma el objetivo y la estrategia de lo formulado, y las tácticas de cada estrategia (una por línea). Las tareas, fechas de inicio y cierre, responsables y recursos se registran a mano. La app avisa si una fecha de cierre es anterior al inicio, si una tarea sale del plazo de su estrategia o si una táctica fue modificada y dejó tareas sin asignar. El Módulo III llega hasta la formulación; no gestiona la ejecución.</p>
  <h3>7. Fuentes</h3><p>Entorno: DANE, Banco de la República y DIAN. Empresas: informes de gestión, de sostenibilidad y estados financieros publicados. Cada serie registra fuente, corte, frecuencia y fecha de consulta. Solo información pública.</p>
  <h3>Limitaciones</h3><ul><li>Dos casos no permiten generalizar; ponen a prueba la estructura del artefacto.</li><li>El diagnóstico interno depende de lo que las empresas eligen publicar.</li><li>Las series ilustrativas deben reemplazarse por cifras oficiales antes de reportar hallazgos.</li></ul></div>`}

  booted=false;connected=false;if(unsubEmp){try{unsubEmp()}catch(e){}unsubEmp=null}
  $("#view").innerHTML='<div class="empty">Conectando con la base de datos del proyecto…</div>';
  const guard=setTimeout(()=>{if(!connected)showConnError("La base de datos no respondió. Verifica que estés con sesión iniciada en claude.ai y vuelve a intentar.")},15000);
  useCap("downloads").then(dl=>{S.dl=dl;if(dl)$("#btnExport").hidden=false});
  useCap("user").then(async user=>{if(!user)return;S.user=user;try{S.uid=await user.id()}catch(_){}try{const w=await user.can("data.write");if(w===false){S.canWrite=false;$("#btnNewEmp").hidden=true;if(S.emp)render()}}catch(e){}});
  const db=await useCap("db");booted=true;
  S.db=db;
  if(!db){clearTimeout(guard);connected=true;render();return}
  let first=true;
  try{unsubEmp=db.collection("empresas").onSnapshot(q=>{connected=true;clearTimeout(guard);
    S.empresas=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.orden??a.nombre).localeCompare(String(b.orden??b.nombre)));
    if(first||!S.empresas.some(x=>x.id===S.eid)){first=false;let saved=null;try{saved=localStorage.getItem("sa_emp")}catch(e){}
      const pick=S.empresas.find(x=>x.id===saved)?saved:(S.empresas[0]?.id||null);
      if(pick!==S.eid)selectEmp(pick);else{renderEmpSel();render()}}
    else{renderEmpSel();schedule()}
  },err=>{clearTimeout(guard);connected=true;showConnError("La conexión con la base de datos se interrumpió"+(err&&err.code?" ("+err.code+")":"")+".")})}
  catch(e){clearTimeout(guard);connected=true;showConnError("No se pudo abrir la base de datos: "+(e&&e.message||e))}
}
boot();
</script>
